name: Desktop Build

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
  pull_request:
    branches: [main, master]
    paths:
      - "desktop/**"

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd desktop
          npm ci

      - name: Test news monitor
        run: |
          cd desktop
          npm test

      - name: Build
        run: |
          cd desktop
          npm run build
